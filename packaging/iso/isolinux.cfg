# isolinux.cfg — NEXUS-OS live stage boot menu
# VGA-first (gfx console), serial mirrored at 115200 for headless CI/smoke.
SERIAL 0 115200
DEFAULT nexus
PROMPT 0
TIMEOUT 20
DISPLAY nexus.msg

LABEL nexus
  KERNEL /isolinux/BOOT.VMZ
  APPEND initrd=/isolinux/INITRD.GZ console=ttyS0,115200 console=tty0 vga=0x318 quiet loglevel=3

LABEL verbose
  KERNEL /isolinux/BOOT.VMZ
  APPEND initrd=/isolinux/INITRD.GZ console=ttyS0,115200 console=tty0 vga=0x318 loglevel=7

LABEL shell
  KERNEL /isolinux/BOOT.VMZ
  APPEND initrd=/isolinux/INITRD.GZ console=ttyS0,115200 console=tty0 vga=0x318 nexus=shell
